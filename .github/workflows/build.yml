name: Build NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 zip unzip curl wget

      - name: Clone and Build
        run: |
          BASE="https://gitlab.com/kalilinux"
          PATH_URL="nethunter/build-scripts"
          git clone --depth 1 "$BASE/$PATH_URL/kali-nethunter-installer.git"
          cd kali-nethunter-installer
          git clone --depth 1 "$BASE/$PATH_URL/kali-nethunter-devices.git" devices
          python3 build.py -d zeroflte-los --nougat --kernel

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeroflte-los-kernel
          path: kali-nethunter-installer/kernel-nethunter-*.zip
