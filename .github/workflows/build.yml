name: Build NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 zip unzip curl wget

      - name: Clone NetHunter Installer
        run: |
          git clone --depth 1 https://gitlab.com || git clone --depth 1 https://gitlab.com kali-nethunter-installer

      - name: Setup Devices and Build Kernel
        run: |
          cd kali-nethunter-installer
          if [ -d "nethunter-installer" ]; then cd nethunter-installer; fi
          git clone --depth 1 https://gitlab.com devices
          python3 build.py -d zeroflte-los --nougat --kernel

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeroflte-los-kernel
          path: "**/kernel-nethunter-*.zip"
